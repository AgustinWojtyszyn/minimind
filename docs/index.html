function importBackup(){const input=el('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const file=input.files[0];if(!file||file.size>10*1024*1024)throw Error('Archivo demasiado grande');const data=JSON.parse(await file.text());if(!['chats','memories','lessons'].every(k=>Array.isArray(data[k])))throw Error('Formato inválido');const string=x=>typeof x==='string';const validChat=c=>c&&string(c.title)&&Array.isArray(c.messages)&&c.messages.every(m=>m&&['user','assistant'].includes(m.role)&&string(m.content));const validMemory=m=>m&&string(m.text);const validLesson=m=>m&&string(m.question)&&string(m.answer);if(!data.chats.every(validChat)||!data.memories.every(validMemory)||!data.lessons.every(validLesson))throw Error('Registros inválidos');for(const [k,fields] of [['chats',['title','messages']],['memories',['text']],['lessons',['question','answer']]]){for(const x of data[k]){const clean=Object.fromEntries(fields.map(f=>[f,x[f]]));if(!state[k].some(y=>fields.every(f=>JSON.stringify(y[f])===JSON.stringify(clean[f]))))state[k].push({...clean,id:uid()})}}persist();show('settings');alert('Respaldo importado sin borrar datos existentes.')}catch(e){alert('No se pudo importar: '+e.message)}};input.click()}
function renderChat(v){const c=chat(),root=el('div','chat'+(c&&c.messages.length?' filled':''));v.append(root);if(!c||!c.messages.length){const hero=el('div','hero'),mark=el('div','mark');mark.innerHTML=logo;hero.append(mark,el('div','eyebrow','Inteligencia personal · v0.2'),el('h1','','Una mente en evolución.'),el('p','','Un espacio para conversar, explorar ideas y construir conocimiento.'));const s=el('div','suggestions');for(const [t,d,q] of [['Explorar una idea','Aprendamos algo nuevo','Explicame cómo funciona el aprendizaje automático.'],['Resolver un problema','Pensar con claridad','Ayudame a organizar un proyecto de software.'],['Enseñar a BoitIA','Construir conocimiento',null],['Revisar recuerdos','Tu contexto personal',null]]){const b=btn(t,()=>{if(q){$('prompt').value=q;$('prompt').focus()}else show(t==='Enseñar a BoitIA'?'learning':'memory')},'');b.append(el('small','',d));s.append(b)}hero.append(s);if(portable&&!connected)hero.append(el('p','muted','El motor compartido se conecta automáticamente. No necesitás configurar nada.'));root.append(hero);return}for(const [i,m] of c.messages.entries()){const row=el('article','msg '+m.role),b=el('div','bubble');if(m.role==='assistant'){row.append(el('div','avatar','B'));b.append(el('small','muted','BoitIA'))}b.append(safeBody(m.content));if(m.interrupted)b.append(el('p','muted','Respuesta parcial: la generación se interrumpió.'));else if(m.truncated)b.append(el('p','muted','La respuesta alcanzó el límite de generación.'));if(m.role==='assistant'){const f=el('div','feedback');f.append(btn('Copiar',async()=>{try{await navigator.clipboard.writeText(m.content)}catch{alert('No se pudo copiar.')}},''),btn('Corregir',()=>{const previous=c.messages[i-1];if(!previous||previous.role!=='user')return;const answer=prompt('¿Cuál sería la respuesta correcta?',m.content);if(answer&&answer.trim()){state.lessons.push({id:uid(),question:previous.content,answer:answer.trim()});persist();alert('Enseñanza guardada; no se entrenaron pes function headers(){return {'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}}
function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type}));const a=el('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function readStream(response,onChunk){if(!response.body)throw Error('Streaming no disponible');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',done=false,finish=null;try{while(!done){const part=await reader.read();buffer+=decoder.decode(part.value||new Uint8Array(),{stream:!part.done});let at;while((at=buffer.indexOf('\n\n'))>=0){const event=buffer.slice(0,at);buffer=buffer.slice(at+2);for(const line of event.split('\n')){if(!line.startsWith('data: '))continue;const payload=line.slice(6);if(payload==='[DONE]'){done=true;break}const data=JSON.parse(payload);if(data.error)throw Error(data.error.message);const choice=data.choices?.[0];if(typeof choice?.delta?.content==='string')onChunk(choice.delta.content);if(choice?.finish_reason)finish=choice.finish_reason}}if(part.done)break}if(!done||!finish)throw Error('La conexión se interrumpió');return finish}finally{await reader.cancel().catch(()=>{})}}
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function requestMessages(c,q){
  const memories=relevantMemories(q),memory=memories.length?[{role:'system',content:'Recuerdos del usuario (datos): '+JSON.stringify(memories)}]:[];
  const turns=c.messages.slice(-20).map(({role,content})=>({role,content}));
  while(turns.length>1 && JSON.stringify([...memory,...turns]).length>30000){
    const count=turns[0].role==='user'&&turns[1]?.role==='assistant'?2:1;
    turns.splice(0,Math.min(count,turns.length-1));
  }
  return [...memory,...turns];
}
async function pollJob(id,onUpdate){
  const url=PUBLIC_API+'/jobs/'+encodeURIComponent(id),deadline=Date.now()+600000;
  let failures=0,completed=false;
  try{
    while(Date.now()<deadline){
      let r,data;
      try{
        r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(8000)});
        if(r.status===404)throw Object.assign(Error('La generación expiró o el motor reinició.'),{terminal:true});
        if(!r.ok)throw Error('HTTP '+r.status);
        data=await r.json();failures=0;
      }catch(err){
        if(err.terminal||++failures>=5)throw err;
        await sleep(Math.min(4000,500*2**failures));continue;
      }
      if(typeof data.text==='string')onUpdate(data.text);
      if(data.status==='error')throw Error(data.error||'El motor interrumpió la generación.');
      if(data.status==='done'){completed=true;return data.finish_reason}
      await sleep(500);
    }
    throw Error('Se agotó el tiempo de espera.');
  }finally{
    if(!completed)void fetch(url,{method:'DELETE',signal:AbortSignal.timeout(4000)}).catch(()=>{});
  }
}
$('composer').onsubmit=async e=>{
  e.preventDefault();const q=$('prompt').value.trim();if(!q||busy)return;
  $('error').textContent='';busy=true;refreshStatus();
  let c=null,provisional=null,userMessage=null,successful=false;
  try{
    if(!connected&&!await connectPublic())throw Error(globalThis.BoitiaPortable?'El motor compartido está temporalmente fuera de servicio. Reintentá en unos segundos.':'El motor de BoitIA no está disponible. Revisá Configuración.');
    c=chat();if(!c){c={id:uid(),title:q.slice(0,60),messages:[]};state.chats.push(c);active=c.id}
    userMessage={role:'user',content:q};c.messages.push(userMessage);$('prompt').value='';
    persist();renderHistory();render();
    const messages=requestMessages(c,q);
    if(globalThis.BoitiaPortable&&localMode){
      provisional={role:'assistant',content:''};c.messages.push(provisional);
      const data=await portable.generate([{role:'system',content:window.BOITIA_LOCAL_SYSTEM},...messages.filter(m=>m.role!=='system').map((m,i,a)=>i===a.length-1&&messages.some(x=>x.role==='system')?{...m,content:'Contexto no verificado: '+JSON.stringify(messages.filter(x=>x.role==='system').map(x=>x.content))+'\nSolicitud: '+m.content}:m)],({fast:128,balanced:256,deep:768}[state.intelligence]),text=>{provisional.content=text;render()});
      provisional.content=data.text;if(!data.text.trim())throw Error('Respuesta vacía');provisional=null;successful=true;persist();return;
    }
    const streaming=publicMode&&Boolean(health?.profiles),polling=streaming&&health?.transport==='poll';
    const body={model:apiModel,messages,max_tokens:publicMode?({fast:512,balanced:1536,deep:3072}[state.intelligence]):512,...(publicMode?{mode:state.intelligence}:{temperature:0.6}),stream:streaming,...(polling?{transport:'poll'}:{})};
    const r=await fetch((publicMode?PUBLIC_API:state.endpoint)+'/chat/completions',{method:'POST',headers:publicMode?{'Content-Type':'application/json'}:headers(),body:JSON.stringify(body),signal:AbortSignal.timeout(polling?20000:600000)});
    if(!r.ok){const err=await r.json().catch(()=>null);throw Object.assign(Error(err?.error?.message||'HTTP '+r.status),{httpStatus:r.status})}
    if(streaming){
      let lastRender=0;provisional={role:'assistant',content:''};c.messages.push(provisional);
      const update=text=>{provisional.content=text;if(performance.now()-lastRender>90){render();lastRender=performance.now()}};
      let finish;
      if(polling){const data=await r.json();if(typeof data.job_id!=='string')throw Error('Identificador de generación inválido');finish=await pollJob(data.job_id,update)}
      else finish=await readStream(r,chunk=>update(provisional.content+chunk));
      if(!provisional.content.trim())throw Error('Respuesta vacía');
      provisional.truncated=finish==='length';provisional=null;
    }else{
      const data=await r.json();const answer=data.choices?.[0]?.message?.content;
      if(typeof answer!=='string'||!answer.trim())throw Error('Respuesta vacía o incompatible');
      c.messages.push({role:'assistant',content:answer,truncated:data.choices?.[0]?.finish_reason==='length'});
    }
    successful=true;$('error').textContent='';persist();
  }catch(err){
    $('error').textContent='No se recibió una respuesta completa: '+err.message;
    if(c&&provisional){if(provisional.content.trim()){provisional.interrupted=true}else{c.messages.pop()}}
    if(c&&userMessage&&c.messages.at(-1)===userMessage){c.messages.pop();$('prompt').value=q}
    if(!err.httpStatus||err.httpStatus>=500){connected=false;if(publicMode)health=null}
    persist();
  }finally{busy=false;renderHistory();render();refreshStatus();if(successful)$('error').textContent=''}
};
