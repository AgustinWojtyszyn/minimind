const KEY='boitia.workspace.v1';const LEGACY_KEY='selfe.workspace.v1';const defaults=()=>({theme:'dark',chats:[],memories:[],lessons:[],endpoint:'',model:'boitia',intelligence:'balanced'});

if(page==='settings'){heading('Configuración','Conectá un motor propio y controlá tus datos.');const c=card('Conexión neuronal');c.append(el('p','muted',publicMode?'BoitIA está conectada automáticamente. No necesitás token.':'La conexión pública se detecta automáticamente si el servidor está disponible.'),btn('Reconectar automáticamente',async()=>{if(await connectPublic()){render();alert('BoitIA conectada.')}else alert('El motor público no está disponible.')}));const endpoint=el('input');endpoint.type='url';endpoint.value=state.endpoint;endpoint.placeholder='https://servidor.example/v1';endpoint.setAttribute('aria-label','URL base de la API');const model=el('input');model.value=state.model;model.setAttribute('aria-label','Identificador del modelo');const key=el('input');key.type='password';key.value=token;key.placeholder='Opcional, solo en memoria de la pestaña';key.setAttribute('aria-label','Token de acceso');c.append(el('label','','URL base (termina en /v1)'),endpoint,el('label','','Modelo'),model,el('label','','Token de acceso'),key,el('p','muted','Usá exclusivamente servidores propios o de confianza. Los mensajes y recuerdos se enviarán al motor seleccionado.'),btn('Guardar y comprobar',async()=>{try{const u=new URL(endpoint.value);if(u.protocol!=='https:'&&!(u.protocol==='http:'&&['localhost','127.0.0.1'].includes(u.hostname)))throw Error('Se requiere HTTPS o localhost.');if(u.username||u.password||u.search||u.hash)throw Error('URL base inválida.');state.endpoint=u.href.replace(/\/$/,'');state.model=model.value.trim()||'boitia';token=key.value;publicMode=false;connected=false;persist();refreshStatus();const res=await fetch(state.endpoint+'/models',{headers:headers(),signal:AbortSignal.timeout(10000)});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data.data))throw Error('Respuesta /models inválida');const ids=data.data.map(m=>m.id);apiModel=state.model==='boitia'&&!ids.includes('boitia')&&ids.includes('selfe')?'selfe':s function safeBody(text){const root=el('div','body');for(const [i,part] of text.split('```').entries()){if(i%2){const pre=el('pre'),code=el('code','',part.replace(/^[a-zA-Z0-9_+-]+\n/,''));pre.append(code);root.append(pre)}else root.append(document.createTextNode(part))}return root}

function renderChat(v){const c=chat(),root=el('div','chat'+(c&&c.messages.length?' filled':''));v.append(root);if(!c||!c.messages.length){const hero=el('div','hero'),mark=el('div','mark');mark.innerHTML=logo;hero.append(mark,el('div','eyebrow','Inteligencia personal · v0.2'),el('h1','','Una mente en evolución.'),el('p','','Un espacio para conversar, explorar ideas y construir conocimiento.'));const s=el('div','suggestions');for(const [t,d,q] of [['Explorar una idea','Aprendamos algo nuevo','Explicame cómo funciona el aprendizaje automático.'],['Resolver un problema','Pensar con claridad','Ayudame a organizar un proyecto de software.'],['Enseñar a BoitIA','Construir conocimiento',null],['Revisar recuerdos','Tu contexto personal',null]]){const b=btn(t,()=>{if(q){$('prompt').value=q;$('prompt').focus()}else show(t==='Enseñar a BoitIA'?'learning':'memory')},'');b.append(el('small','',d));s.append(b)}hero.append(s);root.append(hero);return}for(const [i,m] of c.messages.entries()){const row=el('article','msg '+m.role),b=el('div','bubble');if(m.role==='assistant'){row.append(el('div','avatar','B'));b.append(el('small','muted','BoitIA'))}b.append(safeBody(m.content));if(m.truncated)b.append(el('p','muted','La respuesta alcanzó el límite de generación.'));if(m.role==='assistant'){const f=el('div','feedback');f.append(btn('Copiar',async()=>{try{await navigator.clipboard.writeText(m.content)}catch{alert('No se pudo copiar.')}},''),btn('Corregir',()=>{const previous=c.messages[i-1];if(!previous||previous.role!=='user')return;const answer=prompt('¿Cuál sería la respuesta correcta?',m.content);if(answer&&answer.trim()){state.lessons.push({id:uid(),question:previous.content,answer:answer.trim()});persist();alert('Enseñanza guardada; no se entrenaron pesos.')}},''));b.append(f)}row.append(b);root.append(row)}if(busy)root.append(el('p','muted','BoitIA está generando una respuesta…'));v.scrollTop=v.scrollHeight}

async function readStream(response,onChunk){if(!response.body)throw Error('Streaming no disponible');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',done=false,finish=null;try{while(!done){const part=await reader.read();buffer+=decoder.decode(part.value||new Uint8Array(),{stream:!part.done});let at;while((at=buffer.indexOf('\n\n'))>=0){const event=buffer.slice(0,at);buffer=buffer.slice(at+2);for(const line of event.split('\n')){if(!line.startsWith('data: '))continue;const payload=line.slice(6);if(payload==='[DONE]'){done=true;break}const data=JSON.parse(payload);if(data.error)throw Error(data.error.message);const choice=data.choices?.[0];if(typeof choice?.delta?.content==='string')onChunk(choice.delta.content);if(choice?.finish_reason)finish=choice.finish_reason}}if(part.done)break}if(!done)throw Error('La conexión se interrumpió');return finish}finally{await reader.cancel().catch(()=>{})}}
